name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # Every test is offline: no data download, no API key, no network.
        run: pytest -q
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vikings-win-predictor:ci .
      - name: Smoke test
        # The API must import and start; with no predictions yet, /health reports no seasons.
        run: |
          docker run -d --name api -p 8000:8000 vikings-win-predictor:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
          docker logs api
