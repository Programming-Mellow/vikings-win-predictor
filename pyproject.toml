[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vikpred"
version = "0.1.0"
description = "Weekly Minnesota Vikings win-probability predictions with ML + generative AI explanations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "xgboost>=3.0",
    "shap>=0.48",
    "mlflow>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter",
    "nbconvert",
    "ipykernel",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
